<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - ShortLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">🔗 ShortLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профіль</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про додаток</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Вхід</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Реєстрація</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 bg-light p-4 mb-5">
                    <h2 class="text-center mb-4 fw-bold">Реєстрація</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ім'я</label>
                            <input type="text" id="regName" class="form-control" placeholder="Ваше ім'я" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Електронна пошта</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Пароль</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="Створіть пароль" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Стать</label>
                            <select class="form-select">
                                <option value="" selected disabled>Оберіть стать...</option>
                                <option value="male">Чоловіча</option>
                                <option value="female">Жіноча</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Дата народження</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" id="regBtn" class="btn btn-primary btn-lg">Зареєструватися</button>
                        </div>
                        <div class="text-center mt-3 text-muted">
                            Вже маєте акаунт? <a href="login.html" class="text-decoration-none fw-bold">Увійти</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 Лабораторна робота: Скорочувач посилань.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
